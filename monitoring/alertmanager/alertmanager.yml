global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@sre-capstone.com'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: 'critical-pagerduty'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # SLO-specific alerts
    - match:
        slo: availability
      receiver: 'slo-team'
      group_wait: 15s
      repeat_interval: 2h

    - match:
        slo: latency
      receiver: 'slo-team'
      group_wait: 30s
      repeat_interval: 4h

    # Database alerts
    - match_re:
        alertname: "^(Postgres|Redis).*"
      receiver: 'database-team'
      repeat_interval: 6h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: 'critical-pagerduty'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
        http_config:
          bearer_token: 'PAGERDUTY_TOKEN'

  - name: 'slo-team'
    email_configs:
      - to: 'sre-team@company.com'
        send_resolved: true
        html: |
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b><br>
          {{ .Annotations.summary }}<br>
          {{ .Annotations.description }}
          {{ end }}

  - name: 'database-team'
    email_configs:
      - to: 'db-team@company.com'
        send_resolved: true

inhibit_rules:
  # If service is completely down, suppress latency alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'Latency.*'
    equal: ['job']

  # Suppress warning if critical is already firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
